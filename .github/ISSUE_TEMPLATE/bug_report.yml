name: Bug report
description: Report a problem with the Jobber n8n community node
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include Jobber tokens, client secrets, or customer data.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The version of @salesai-prod/n8n-nodes-jobber you are using.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: n8n-version
    attributes:
      label: n8n version
      placeholder: 2.21.5
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - Customer Get
        - Customer Search
        - Customer Create
        - Job Get
        - Job Create
        - Schedule Get Availability
        - OAuth/Credentials
        - Install/Packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Run...
        3. See...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Remove credentials, tokens, client data, and PII before pasting.
      render: shell
